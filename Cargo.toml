[package]
name = "tracerva"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Raster-to-SVG tracing in Rust, with palette cleanup, curve fitting and geometric shape recovery"
readme = "README.md"
repository = "https://github.com/msdshsk/tracerva"
keywords = ["svg", "vector", "tracing", "image", "graphics"]
categories = ["graphics", "multimedia::images"]
include = ["src/**", "examples/**", "README.md", "Cargo.toml", "Cargo.lock", "LICENSE*"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
thiserror = "2"
